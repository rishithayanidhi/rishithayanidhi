<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 350" width="1000" height="350" role="img" aria-label="Rishi Thayanidhi - Full Stack, DevOps, Machine Learning" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#818CF8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.1" r="0.8">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="c1"><rect x="40" y="72" width="0" height="30"><animate attributeName="width" from="0" to="220" dur="0.6s" begin="0.3s" fill="freeze"/></rect></clipPath>
    <clipPath id="c2"><rect x="40" y="106" width="0" height="70"><animate attributeName="width" from="0" to="620" dur="1.2s" begin="1s" fill="freeze"/></rect></clipPath>
    <clipPath id="c3"><rect x="40" y="184" width="0" height="30"><animate attributeName="width" from="0" to="260" dur="0.7s" begin="2.4s" fill="freeze"/></rect></clipPath>
    <clipPath id="c4"><rect x="40" y="224" width="0" height="38"><animate attributeName="width" from="0" to="700" dur="1.4s" begin="3.1s" fill="freeze"/></rect></clipPath>
  </defs>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace">
    <!-- window -->
    <rect x="10" y="10" width="980" height="330" rx="14" fill="#0B1220" stroke="#1F2A44" stroke-width="1.5"/>
    <rect x="10" y="10" width="980" height="330" rx="14" fill="url(#glow)"/>
    <rect x="10" y="10" width="980" height="40" rx="14" fill="#111A2E"/>
    <rect x="10" y="36" width="980" height="14" fill="#111A2E"/>
    <circle cx="36" cy="30" r="6" fill="#FF5F56"/>
    <circle cx="58" cy="30" r="6" fill="#FFBD2E"/>
    <circle cx="80" cy="30" r="6" fill="#27C93F"/>
    <text x="500" y="35" text-anchor="middle" font-size="13" fill="#64748B">rishi@chennai: ~/profile — zsh</text>

    <!-- line 1 -->
    <g clip-path="url(#c1)">
      <text x="40" y="95" font-size="20"><tspan fill="#22D3EE">$</tspan><tspan fill="#E2E8F0"> whoami</tspan></text>
    </g>

    <!-- line 2: name -->
    <g clip-path="url(#c2)">
      <text x="40" y="160" font-size="56" font-weight="700" fill="url(#name)">Rishi Thayanidhi</text>
    </g>

    <!-- line 3 -->
    <g clip-path="url(#c3)">
      <text x="40" y="205" font-size="20"><tspan fill="#22D3EE">$</tspan><tspan fill="#E2E8F0"> cat stack.txt</tspan></text>
    </g>

    <!-- line 4 -->
    <g clip-path="url(#c4)">
      <text x="40" y="250" font-size="26" fill="#E2E8F0">Full Stack  <tspan fill="#22D3EE">·</tspan>  DevOps  <tspan fill="#22D3EE">·</tspan>  Machine Learning</text>
    </g>

    <!-- line 5: prompt + cursor -->
    <text x="40" y="292" font-size="20" fill="#22D3EE" opacity="0">$
      <animate attributeName="opacity" from="0" to="1" dur="0.01s" begin="4.6s" fill="freeze"/>
    </text>
    <rect x="62" y="276" width="11" height="20" fill="#22D3EE" opacity="0">
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.01;0.5;0.51;1" dur="1s" begin="4.6s" repeatCount="indefinite"/>
    </rect>

    <!-- pods panel -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="2s" fill="freeze"/>
      <rect x="700" y="76" width="260" height="112" rx="10" fill="#0F1A30" stroke="#1F2A44"/>
      <text x="716" y="98" font-size="12" fill="#64748B">$ kubectl get pods</text>
      <circle cx="722" cy="121" r="4" fill="#27C93F"><animate attributeName="opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite"/></circle>
      <text x="736" y="126" font-size="14" fill="#E2E8F0">full-stack</text>
      <text x="944" y="126" font-size="14" fill="#27C93F" text-anchor="end">Running</text>
      <circle cx="722" cy="146" r="4" fill="#27C93F"><animate attributeName="opacity" values="1;0.3;1" dur="1.6s" begin="0.4s" repeatCount="indefinite"/></circle>
      <text x="736" y="151" font-size="14" fill="#E2E8F0">devops</text>
      <text x="944" y="151" font-size="14" fill="#27C93F" text-anchor="end">Running</text>
      <circle cx="722" cy="171" r="4" fill="#FFBD2E"><animate attributeName="opacity" values="1;0.3;1" dur="1.6s" begin="0.8s" repeatCount="indefinite"/></circle>
      <text x="736" y="176" font-size="14" fill="#E2E8F0">ml-research</text>
      <text x="944" y="176" font-size="14" fill="#FFBD2E" text-anchor="end">Learning</text>
    </g>

    <!-- heartbeat -->
    <path d="M30 316 H260 L275 316 L285 290 L297 336 L309 280 L321 328 L330 316 H560 L575 316 L585 290 L597 336 L609 280 L621 328 L630 316 H970" fill="none" stroke="#1E293B" stroke-width="2" stroke-linejoin="round"/>
    <path d="M30 316 H260 L275 316 L285 290 L297 336 L309 280 L321 328 L330 316 H560 L575 316 L585 290 L597 336 L609 280 L621 328 L630 316 H970" fill="none" stroke="#22D3EE" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" pathLength="1000" stroke-dasharray="140 860">
      <animate attributeName="stroke-dashoffset" from="140" to="-860" dur="3.2s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
