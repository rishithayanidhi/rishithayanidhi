    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1A1608"/><stop offset="0.5" stop-color="#0B1220"/><stop offset="1" stop-color="#0B1220"/></linearGradient>
    <clipPath id="card"><rect x="2" y="2" width="996" height="96" rx="14"/></clipPath>
  </defs>
  <g font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
