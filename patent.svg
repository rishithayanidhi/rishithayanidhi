    <polygon points="50,32 54.41,43.93 67.12,44.44 57.13,52.32 60.58,64.56 50,57.5 39.42,64.56 42.87,52.32 32.88,44.44 45.59,43.93" fill="url(#gold)"/>
    <text x="100" y="38" font-size="12" font-weight="700" letter-spacing="3" fill="#F59E0B">PATENT HOLDER</text>
    <text x="100" y="68" font-size="26" font-weight="700" fill="#F8FAFC">Autonomous Solar Panel Cleaning System</text>
    <g clip-path="url(#card)">
      <rect x="-120" y="-10" width="70" height="130" fill="#FFFFFF" opacity="0.08" transform="skewX(-20)">
